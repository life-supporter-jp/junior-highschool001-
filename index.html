const cards = document.getElementById('cards');
let voices = [];
let speechRate = 1.0; // 再生スピード

function populateVoices() {
  voices = speechSynthesis.getVoices();
}
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = populateVoices;
}

function speak(text, lang) {
  if(!voices.length) voices = speechSynthesis.getVoices();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = speechRate;
  utter.pitch = 1.0;
  let voice;

  if(lang==='en-US'){
    voice = voices.find(v=>v.lang==='en-US' && /samantha|alloy|serena/i.test(v.name)) || voices.find(v=>v.lang==='en-US') || voices[0];
  } else if(lang==='ja-JP'){
    voice = voices.find(v=>v.lang==='ja-JP' && /kyoko|yui|haruka/i.test(v.name)) || voices.find(v=>v.lang==='ja-JP') || voices[0];
  } else {
    voice = voices[0];
  }

  if(voice) utter.voice = voice;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function renderCards() {
  cards.innerHTML = '';
  data.forEach(group=>{
    const div = document.createElement('div');
    div.className = 'card';

    const title = document.createElement('div');
    title.className = 'pattern';
    title.textContent = group.pattern;
    div.appendChild(title);

    let currentMode = 'en+jp';

    group.examples.forEach(([en,jp])=>{
      const ex = document.createElement('div');
      ex.className = 'example';
      const text = document.createElement('div');
      text.innerHTML = `<strong>${en}</strong> <span class="jp">${jp}</span>`;

      const btn = document.createElement('button');
      btn.textContent = '?再生';
      btn.onclick = ()=>{
        if(currentMode==='en+jp' || currentMode==='jpEn') speak(en,'en-US');
        else if(currentMode==='enJp') speak(jp,'ja-JP');
        else if(currentMode==='jpEn') speak(en,'en-US');
        else if(currentMode==='jp') speak(jp,'ja-JP');
      };

      ex.appendChild(text);
      ex.appendChild(btn);
      div.appendChild(ex);
    });

    const btnDiv = document.createElement('div');
    btnDiv.className = 'pattern-buttons';

    const b1 = document.createElement('button');
    b1.textContent = '英語＋日本語 → 英語発音';
    b1.onclick = ()=>{
      currentMode='en+jp';
      group.examples.forEach((ex,i)=>{
        const exDiv = div.querySelectorAll('.example')[i].children[0];
        exDiv.innerHTML = `<strong>${ex[0]}</strong> <span class="jp">${ex[1]}</span>`;
      });
    };

    const b2 = document.createElement('button');
    b2.textContent = '日本語表示 → 英語発音';
    b2.onclick = ()=>{
      currentMode='jpEn';
      group.examples.forEach((ex,i)=>{
        const exDiv = div.querySelectorAll('.example')[i].children[0];
        exDiv.innerHTML = `<span class="jp">${ex[1]}</span>`;
      });
    };

    const b3 = document.createElement('button');
    b3.textContent = '英語表示 → 日本語発音';
    b3.onclick = ()=>{
      currentMode='enJp';
      group.examples.forEach((ex,i)=>{
        const exDiv = div.querySelectorAll('.example')[i].children[0];
        exDiv.innerHTML = `<strong>${ex[0]}</strong>`;
      });
    };

    btnDiv.appendChild(b1);
    btnDiv.appendChild(b2);
    btnDiv.appendChild(b3);
    div.appendChild(btnDiv);

    cards.appendChild(div);
  });
}

// スピードスライダー操作
document.getElementById('speedRange').addEventListener('input', e=>{
  speechRate = parseFloat(e.target.value);
  document.getElementById('speedValue').textContent = speechRate.toFixed(1);
});

renderCards();
</script>
